<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Vishnumaya Temple — Divine Presence</title>
<!-- PREMIUM FONTS: Cinzel for elegance, matching tagline and main text harmony -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Cinzel', serif;
    background: #0a0702;
    overflow-x: hidden;
  }

  /* HERO SECTION – full screen with deity image fully visible, text on top */
  .hero {
    min-height: 100vh;
    width: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;  /* pushes button down naturally */
    background: url('assets/vishnumaya.jpg') no-repeat center center/cover;
    background-attachment: fixed;
    background-position: center 35%; /* focus on Lord's face clearly, no cropping of divine presence */
  }

  /* Gentle overlay so the deity remains visible and text readable */
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 30% 25%, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.4) 55%, rgba(0,0,0,0.65) 100%);
    backdrop-filter: brightness(0.94);
    z-index: 1;
  }

  /* TOP BAR — refined gold border, stays accessible */
  .lang-bar {
    position: absolute;
    top: 28px;
    right: 35px;
    z-index: 20;
    display: flex;
    gap: 8px;
    background: rgba(10, 7, 2, 0.55);
    backdrop-filter: blur(8px);
    padding: 8px 18px;
    border-radius: 60px;
    border: 1px solid rgba(218, 165, 32, 0.65);
    box-shadow: 0 0 12px rgba(218, 165, 32, 0.2);
    font-family: 'Cinzel', serif;
  }

  .lang-btn {
    background: transparent;
    border: none;
    color: #f5e2b0;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }

  .lang-btn:hover {
    color: #ffdf8c;
    text-shadow: 0 0 6px #e4b363;
    background: rgba(255, 215, 0, 0.12);
    transform: translateY(-1px);
  }

  /* MAIN CONTENT WRAPPER - aligned at top, compact, unified font styling */
  .top-content {
    position: relative;
    z-index: 15;
    width: 100%;
    text-align: center;
    padding-top: 10vh;      /* breathing space from top, Lord's face fully visible below */
    padding-left: 24px;
    padding-right: 24px;
  }

  /* SACRED SYMBOL (OM) - consistent font family and weight, matches tagline style */
  .sacred-symbol {
    text-align: center;
    margin-bottom: 8px;
  }

  .om-glow {
    font-size: 38px;
    font-weight: 500;       /* same weight as tagline for harmony */
    font-family: 'Cinzel', serif;
    background: linear-gradient(135deg, #ffe6b3, #e5b83c, #f5c542);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 12px rgba(255, 200, 70, 0.4);
    letter-spacing: 2px;
    display: inline-block;
    animation: subtlePulse 3s infinite ease-in-out;
    line-height: 1;
  }

  @keyframes subtlePulse {
    0% { text-shadow: 0 0 8px rgba(255, 200, 70, 0.3); opacity: 0.95; transform: scale(1);}
    50% { text-shadow: 0 0 16px rgba(255, 220, 90, 0.6); opacity: 1; transform: scale(1.01);}
    100% { text-shadow: 0 0 8px rgba(255, 200, 70, 0.3); opacity: 0.95; transform: scale(1);}
  }

  .ornament-line {
    width: 100px;
    height: 1.5px;
    background: linear-gradient(90deg, transparent, #e6bc72, #ffdfa5, #e6bc72, transparent);
    margin: 8px auto 0 auto;
    border-radius: 2px;
    box-shadow: 0 0 4px #e6bc72;
  }

  /* TITLE — VISHNUMAYA: same font family, elegant weight but not oversized, blending with tagline style */
  .temple-title {
    font-size: 3.2rem;
    font-weight: 600;       /* refined, consistent with sacred tagline weight */
    font-family: 'Cinzel', serif;
    letter-spacing: 4px;
    margin-top: 6px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #FFF6CF 10%, #F7D44A 45%, #CFA22E 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    word-break: keep-all;
    line-height: 1.2;
  }

  /* TAGLINE - exactly the same font styling as reference, clean and divine */
  .sacred-tagline {
    font-size: 1.2rem;
    font-weight: 500;
    font-family: 'Cinzel', serif;
    color: #FFF0CF;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    line-height: 1.4;
    margin-top: 4px;
    letter-spacing: 0.3px;
    backdrop-filter: blur(2px);
  }

  /* BUTTON – moved down naturally with flex spacing, elegant and not intrusive */
  .button-wrapper {
    position: relative;
    z-index: 15;
    width: 100%;
    display: flex;
    justify-content: center;
    padding-bottom: 8vh;    /* gives space at bottom, button sits lower but visible */
    margin-top: auto;       /* flex pushes button down */
  }

  .divine-btn {
    padding: 12px 36px;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Cinzel', serif;
    background: linear-gradient(145deg, #b87c2e, #8b5a2b);
    border: none;
    border-radius: 60px;
    color: #FFFAEA;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px -6px rgba(0,0,0,0.6), inset 0 1px 0px rgba(255,245,170,0.4);
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  .divine-btn i {
    font-size: 0.9rem;
    transition: transform 0.3s;
  }

  .divine-btn:hover {
    transform: scale(1.02);
    background: linear-gradient(145deg, #cf9b42, #9f6b2e);
    box-shadow: 0 12px 24px -6px black, inset 0 1px 2px rgba(255,245,180,0.6);
    letter-spacing: 1.8px;
  }

  .divine-btn:hover i {
    transform: translateX(4px);
  }

  /* Lotus decorative element - subtle bottom accent */
  .sacred-lotus {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 12;
    font-size: 18px;
    color: rgba(255,215,130,0.45);
    letter-spacing: 10px;
    pointer-events: none;
  }

  /* Responsive: keep text elegant, Lord's face always visible */
  @media (max-width: 800px) {
    .top-content {
      padding-top: 8vh;
    }
    .temple-title {
      font-size: 2.6rem;
      letter-spacing: 3px;
    }
    .sacred-tagline {
      font-size: 1rem;
    }
    .divine-btn {
      padding: 10px 28px;
      font-size: 0.9rem;
    }
    .om-glow {
      font-size: 32px;
    }
    .lang-bar {
      top: 18px;
      right: 18px;
      padding: 5px 12px;
    }
    .lang-btn {
      font-size: 0.7rem;
      padding: 3px 8px;
    }
    .ornament-line {
      width: 80px;
    }
    .button-wrapper {
      padding-bottom: 6vh;
    }
  }

  @media (max-width: 550px) {
    .top-content {
      padding-top: 6vh;
    }
    .temple-title {
      font-size: 2rem;
      letter-spacing: 2px;
    }
    .sacred-tagline {
      font-size: 0.85rem;
    }
    .divine-btn {
      padding: 8px 22px;
      font-size: 0.8rem;
      gap: 6px;
    }
    .om-glow {
      font-size: 28px;
    }
    .ornament-line {
      width: 65px;
    }
    .sacred-lotus {
      font-size: 14px;
      letter-spacing: 6px;
      bottom: 15px;
    }
    .button-wrapper {
      padding-bottom: 5vh;
    }
  }

  /* fade-in for content */
  .top-content, .button-wrapper {
    animation: gentleFade 0.9s ease-out;
  }
  @keyframes gentleFade {
    0% { opacity: 0; transform: translateY(-12px);}
    100% { opacity: 1; transform: translateY(0);}
  }

  /* Optional grain texture for atmosphere */
  .hero::after {
    content: '';
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 2px, transparent 2px, transparent 6px);
    pointer-events: none;
    z-index: 3;
  }

  /* ensure lord's face is not hidden: background-position adjusted and no extra covering */
  .hero {
    background-position: center 32%;
  }
  @media (max-width: 768px) {
    .hero {
      background-position: center 30%;
    }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="overlay"></div>

  <!-- Language Switcher -->
  <div class="lang-bar">
    <button class="lang-btn" data-lang="ml">മലയാളം</button>
    <button class="lang-btn" data-lang="hi">हिंदी</button>
    <button class="lang-btn" data-lang="ta">தமிழ்</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>

  <!-- TOP ALIGNED CONTENT: OM, title, tagline — unified font styling, positioned at top, leaving lord fully visible -->
  <div class="top-content">
    <div class="sacred-symbol">
      <div class="om-glow">ॐ</div>
      <div class="ornament-line"></div>
    </div>
    <h1 class="temple-title" id="dynamicTitle">VISHNUMAYA</h1>
    <div class="sacred-tagline" id="dynamicTagline">
      He is not just worshipped…<br>He is experienced
    </div>
  </div>

  <!-- BUTTON placed down naturally using flex spacing, not overlapping the deity face -->
  <div class="button-wrapper">
    <button class="divine-btn" id="enterBtn">
      <span id="btnText">Enter the Divine Space</span> <i class="fas fa-arrow-right"></i>
    </button>
  </div>

  <div class="sacred-lotus">
    <i class="fas fa-lotus"></i> <i class="fas fa-circle-notch"></i> <i class="fas fa-pray"></i>
  </div>
</div>

<script>
  // Translations with same stylistic harmony
  const translations = {
    en: {
      title: "VISHNUMAYA",
      tagline: "He is not just worshipped…<br>He is experienced",
      button: "Enter the Divine Space"
    },
    ml: {
      title: "വിഷ്ണുമായ",
      tagline: "അവനെ പൂജിക്കുന്നതല്ല…<br>അനുഭവിക്കുന്നതാണ്",
      button: "ദിവ്യസാന്നിദ്ധ്യത്തിലേക്ക്"
    },
    hi: {
      title: "विष्णुमाया",
      tagline: "इनकी पूजा मात्र नहीं की जाती…<br>इन्हें अनुभव किया जाता है",
      button: "दिव्य स्थान में प्रवेश करें"
    },
    ta: {
      title: "விஷ்ணுமாயா",
      tagline: "அவரை வெறும் வழிபடுவதில்லை…<br>அனுபவிக்கப்படுகிறார்",
      button: "தெய்வீக இடத்திற்குள் நுழையுங்கள்"
    }
  };

  let currentLang = "en";

  const titleEl = document.getElementById("dynamicTitle");
  const taglineEl = document.getElementById("dynamicTagline");
  const btnSpan = document.getElementById("btnText");

  function setLanguage(lang) {
    if (!translations[lang]) return;
    currentLang = lang;
    const data = translations[lang];
    
    // subtle crossfade for smoothness
    titleEl.style.opacity = "0.6";
    taglineEl.style.opacity = "0.6";
    
    setTimeout(() => {
      titleEl.innerText = data.title;
      taglineEl.innerHTML = data.tagline;
      btnSpan.innerText = data.button;
      
      titleEl.style.opacity = "1";
      taglineEl.style.opacity = "1";
    }, 50);
    
    document.documentElement.setAttribute("lang", lang === "ml" ? "ml" : (lang === "hi" ? "hi" : (lang === "ta" ? "ta" : "en")));
  }

  const langBtns = document.querySelectorAll(".lang-btn");
  langBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      const langValue = btn.getAttribute("data-lang");
      if (langValue) setLanguage(langValue);
    });
  });

  // Portal Modal Experience (divine and immersive)
  function createPortalModal() {
    if (document.getElementById("divinePortalModal")) return;
    
    const modalDiv = document.createElement("div");
    modalDiv.id = "divinePortalModal";
    modalDiv.style.position = "fixed";
    modalDiv.style.top = "0";
    modalDiv.style.left = "0";
    modalDiv.style.width = "100%";
    modalDiv.style.height = "100%";
    modalDiv.style.backgroundColor = "rgba(0,0,0,0.88)";
    modalDiv.style.backdropFilter = "blur(12px)";
    modalDiv.style.zIndex = "9999";
    modalDiv.style.display = "flex";
    modalDiv.style.alignItems = "center";
    modalDiv.style.justifyContent = "center";
    modalDiv.style.fontFamily = "'Cinzel', serif";
    modalDiv.style.opacity = "0";
    modalDiv.style.transition = "opacity 0.5s ease";
    
    const modalCard = document.createElement("div");
    modalCard.style.maxWidth = "480px";
    modalCard.style.width = "85%";
    modalCard.style.background = "linear-gradient(145deg, #1f1a0c, #120e05)";
    modalCard.style.borderRadius = "48px";
    modalCard.style.padding = "2rem 1.8rem";
    modalCard.style.textAlign = "center";
    modalCard.style.border = "1px solid rgba(218,165,32,0.55)";
    modalCard.style.boxShadow = "0 25px 45px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(210,160,50,0.2)";
    modalCard.style.transform = "scale(0.96)";
    modalCard.style.transition = "transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.2)";
    
    let modalTitle = "", modalMsg = "", closeBtnText = "";
    
    if (currentLang === "en") {
      modalTitle = "Entering the Divine Presence";
      modalMsg = "May the grace of Vishnumaya awaken within you. Step forward with devotion. The sacred space awaits your soul.";
      closeBtnText = "Open the Inner Temple";
    } else if (currentLang === "ml") {
      modalTitle = "ദിവ്യ സാന്നിദ്ധ്യത്തിലേക്ക്";
      modalMsg = "വിഷ്ണുമായയുടെ അനുഗ്രഹം നിങ്ങളിലുണരട്ടെ. ഭക്തിയോടെ മുന്നോട്ട് പോകുക. പവിത്രമായ ഇടം നിങ്ങളെ സ്വീകരിക്കാൻ കാത്തിരിക്കുന്നു.";
      closeBtnText = "അകത്തെ ക്ഷേത്രത്തിലേക്ക്";
    } else if (currentLang === "hi") {
      modalTitle = "दिव्य उपस्थिति में प्रवेश";
      modalMsg = "विष्णुमाया की कृपा आपके भीतर जागृत हो। भक्ति के साथ आगे बढ़ें। पवित्र स्थान आपकी आत्मा की प्रतीक्षा कर रहा है।";
      closeBtnText = "आंतरिक मंदिर खोलें";
    } else {
      modalTitle = "தெய்வீக பிரசன்னத்தில் நுழைகிறது";
      modalMsg = "விஷ்ணுமாயாவின் அருள் உங்களுக்குள் துயிலெழட்டும். பக்தியுடன் முன்னேறுங்கள். புனித இடம் உங்கள் ஆன்மாவிற்காகக் காத்திருக்கிறது.";
      closeBtnText = "உள் கோவிலுக்குள் செல்லுங்கள்";
    }
    
    modalCard.innerHTML = `
      <i class="fas fa-om" style="font-size: 2.5rem; color: #eab354; margin-bottom: 18px; display: block;"></i>
      <h2 style="color: #FFE3A4; font-size: 1.6rem; margin-bottom: 18px; letter-spacing: 1.5px; font-weight: 600; font-family: 'Cinzel', serif;">${modalTitle}</h2>
      <p style="color: #efe0bc; line-height: 1.55; font-size: 0.98rem; margin-bottom: 32px; font-family: 'Cinzel', serif;">${modalMsg}</p>
      <button id="modalEnterDeepBtn" style="background: linear-gradient(145deg,#b87c2e,#7c551f); border:none; padding: 11px 26px; border-radius: 60px; color: #FFFAEA; font-family: 'Cinzel', serif; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; letter-spacing: 1.2px; box-shadow: 0 4px 12px black;">${closeBtnText} <i class="fas fa-praying-hands"></i></button>
    `;
    
    modalDiv.appendChild(modalCard);
    document.body.appendChild(modalDiv);
    
    setTimeout(() => {
      modalDiv.style.opacity = "1";
      modalCard.style.transform = "scale(1)";
    }, 20);
    
    const enterDeepBtn = modalCard.querySelector("#modalEnterDeepBtn");
    const closeModal = () => {
      modalDiv.style.opacity = "0";
      modalCard.style.transform = "scale(0.96)";
      setTimeout(() => {
        if (modalDiv && modalDiv.parentNode) modalDiv.remove();
        showBriefToast();
      }, 400);
    };
    
    enterDeepBtn.addEventListener("click", closeModal);
    modalDiv.addEventListener("click", (e) => {
      if (e.target === modalDiv) closeModal();
    });
  }
  
  function showBriefToast() {
    const toast = document.createElement("div");
    toast.innerText = currentLang === "en" ? "🕉️ You have entered the sacred realm of Vishnumaya" : 
                      (currentLang === "ml" ? "🕉️ വിഷ്ണുമായയുടെ പുണ്യഭൂമിയിൽ പ്രവേശിച്ചു" :
                      (currentLang === "hi" ? "🕉️ आप विष्णुमाया के पवित्र क्षेत्र में प्रवेश कर चुके हैं" : 
                      "🕉️ விஷ்ணுமாயாவின் புனித எல்லைக்குள் நுழைந்துவிட்டீர்கள்"));
    toast.style.position = "fixed";
    toast.style.bottom = "30px";
    toast.style.left = "50%";
    toast.style.transform = "translateX(-50%)";
    toast.style.backgroundColor = "#1e1a0e";
    toast.style.color = "#ffdfaa";
    toast.style.padding = "10px 24px";
    toast.style.borderRadius = "60px";
    toast.style.fontFamily = "'Cinzel', serif";
    toast.style.fontSize = "0.8rem";
    toast.style.fontWeight = "500";
    toast.style.border = "1px solid #e1b153";
    toast.style.backdropFilter = "blur(10px)";
    toast.style.zIndex = "10000";
    toast.style.boxShadow = "0 6px 16px rgba(0,0,0,0.5)";
    toast.style.letterSpacing = "0.8px";
    toast.style.whiteSpace = "nowrap";
    document.body.appendChild(toast);
    
    setTimeout(() => {
      toast.style.opacity = "0";
      toast.style.transition = "opacity 0.5s";
      setTimeout(() => toast.remove(), 600);
    }, 2600);
  }
  
  const enterBtn = document.getElementById("enterBtn");
  
  // Ripple + open portal, button placed lower but fully functional
  enterBtn.addEventListener("click", (e) => {
    const ripple = document.createElement("span");
    const rect = enterBtn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = `${size}px`;
    ripple.style.left = `${e.clientX - rect.left - size/2}px`;
    ripple.style.top = `${e.clientY - rect.top - size/2}px`;
    ripple.style.position = "absolute";
    ripple.style.borderRadius = "50%";
    ripple.style.backgroundColor = "rgba(255,215,0,0.5)";
    ripple.style.pointerEvents = "none";
    ripple.style.transform = "scale(0)";
    ripple.style.transition = "transform 0.5s ease-out, opacity 0.5s";
    ripple.style.opacity = "0.7";
    enterBtn.style.position = "relative";
    enterBtn.style.overflow = "hidden";
    enterBtn.appendChild(ripple);
    
    setTimeout(() => {
      ripple.style.transform = "scale(4)";
      ripple.style.opacity = "0";
    }, 10);
    
    setTimeout(() => ripple.remove(), 500);
    createPortalModal();
  });
  
  // detect initial language
  function detectAndSetInitialLanguage() {
    const browserLang = navigator.language || navigator.userLanguage;
    if (browserLang.startsWith("ml")) setLanguage("ml");
    else if (browserLang.startsWith("hi")) setLanguage("hi");
    else if (browserLang.startsWith("ta")) setLanguage("ta");
    else setLanguage("en");
  }
  
  detectAndSetInitialLanguage();
  
  // ripple style injection
  const rippleStyle = document.createElement('style');
  rippleStyle.textContent = `
    .ripple-effect {
      position: absolute;
      border-radius: 50%;
      background-color: rgba(255, 210, 90, 0.5);
      transform: scale(0);
      animation: rippleAnim 0.5s linear;
      pointer-events: none;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }
  `;
  document.head.appendChild(rippleStyle);
  
  // Image fallback: ensures lord remains visible even if image fails
  const heroDiv = document.querySelector('.hero');
  const imgTest = new Image();
  imgTest.onerror = function() {
