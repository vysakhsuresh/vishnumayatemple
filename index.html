<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vishnumaya Temple</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0d0d0d;
    color:white;
}

/* TOP BAR */
.topbar {
    position:absolute;
    top:15px;
    right:20px;
    z-index:10;
}

.topbar button {
    background:rgba(0,0,0,0.7);
    border:1px solid #ff9933;
    color:#ff9933;
    margin-left:10px;
    padding:6px 12px;
    cursor:pointer;
    border-radius:6px;
    font-weight:bold;
}

.topbar button:hover {
    background:#ff9933;
    color:black;
}

/* HERO */
.hero {
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    background:url('assets/vishnumaya.jpg') no-repeat center center;
    background-size:cover;
}

.overlay {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.75);
}

.content {
    position:relative;
    z-index:2;
}

/* IMAGE */
.hero img {
    width:300px;
    border-radius:20px;
    box-shadow:0 0 40px gold;
}

/* TEXT */
h1 {
    font-size:48px;
    margin-top:20px;
}

.tagline {
    font-size:22px;
    color:#ffcc66;
    margin-top:10px;
}

/* BUTTON */
.btn {
    margin-top:25px;
    padding:12px 25px;
    background:#ff9933;
    border:none;
    color:black;
    font-weight:bold;
    cursor:pointer;
    border-radius:8px;
}

.btn:hover {
    background:#ffaa44;
}
</style>

</head>

<body>

<div class="topbar">
    <button onclick="setLang('ml')">മലയാളം</button>
    <button onclick="setLang('hi')">हिंदी</button>
    <button onclick="setLang('ta')">தமிழ்</button>
    <button onclick="setLang('en')">English</button>
</div>

<div class="hero">

<div class="overlay"></div>

<div class="content">


    <h1 id="title">VISHNUMAYA</h1>

    <div class="tagline" id="tagline">
        He is not just worshipped…<br>
        He is experienced
    </div>

    <button class="btn" id="enterBtn">Enter the Divine Space</button>

</div>

</div>

<script>
function setLang(lang) {

    const tagline = document.getElementById("tagline");
    const title = document.getElementById("title");
    const btn = document.getElementById("enterBtn");

    if(lang === "en") {
        title.innerText = "VISHNUMAYA";
        tagline.innerHTML = "He is not just worshipped…<br>He is experienced";
        btn.innerText = "Enter the Divine Space";
    }

    if(lang === "ml") {
        title.innerText = "വിഷ്ണുമായ";
        tagline.innerHTML = "അവനെ പൂജിക്കുന്നതല്ല…<br>അനുഭവിക്കുന്നതാണ്";
        btn.innerText = "ദിവ്യലോകത്തിലേക്ക് പ്രവേശിക്കുക";
    }

    if(lang === "hi") {
        title.innerText = "विष्णुमाया";
        tagline.innerHTML = "इनकी पूजा मात्र नहीं की जाती…<br>इन्हें अनुभव किया जाता है";
        btn.innerText = "दिव्य लोक में प्रवेश करें";
    }

    if(lang === "ta") {
        title.innerText = "விஷ்ணுமாயா";
        tagline.innerHTML = "அவரை வெறும் வழிபடுவதில்லை…<br>அனுபவிக்கப்படுகிறார்";
        btn.innerText = "தெய்வீக உலகிற்குள் செல்லுங்கள்";
    }

}
</script>

</body>
</html>
