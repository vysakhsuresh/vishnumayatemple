<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Vishnumaya Temple — Divine Presence</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Cinzel', serif;
    background: #050301;
    overflow: hidden; /* Prevents scrollbars from particles */
  }

  /* HERO SECTION */
  .hero {
    height: 100vh;
    width: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: url('assets/vishnumaya.jpg') no-repeat center center/cover;
    background-attachment: fixed;
    background-position: center 30%;
  }

  /* Advanced Cinematic Overlay */
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 40%, rgba(20, 12, 5, 0.1) 0%, rgba(5, 3, 1, 0.6) 60%, rgba(0, 0, 0, 0.9) 100%);
    backdrop-filter: brightness(0.85) contrast(1.1);
    z-index: 1;
  }

  /* DIVINE PARTICLES (Ambient floating light dust) */
  .particles {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    pointer-events: none;
  }
  
  .particle {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,100,1) 0%, rgba(255,150,0,0) 80%);
    opacity: 0;
    animation: floatUp 8s infinite ease-in-out;
  }

  @keyframes floatUp {
    0% { transform: translateY(100px) scale(0); opacity: 0; }
    20% { opacity: 0.6; }
    80% { opacity: 0.6; }
    100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
  }

  /* Generate multiple particles with varying delays and positions */
  .particle:nth-child(1) { left: 10%; width: 4px; height: 4px; animation-duration: 9s; animation-delay: 0s; }
  .particle:nth-child(2) { left: 30%; width: 6px; height: 6px; animation-duration: 12s; animation-delay: 2s; }
  .particle:nth-child(3) { left: 50%; width: 3px; height: 3px; animation-duration: 7s; animation-delay: 4s; }
  .particle:nth-child(4) { left: 70%; width: 5px; height: 5px; animation-duration: 11s; animation-delay: 1s; }
  .particle:nth-child(5) { left: 90%; width: 7px; height: 7px; animation-duration: 14s; animation-delay: 3s; }
  .particle:nth-child(6) { left: 20%; width: 4px; height: 4px; animation-duration: 10s; animation-delay: 5s; }
  .particle:nth-child(7) { left: 80%; width: 5px; height: 5px; animation-duration: 8s; animation-delay: 2.5s; }

  /* TOP BAR - Glassmorphism */
  .lang-bar {
    position: absolute;
    top: 30px;
    right: 40px;
    z-index: 20;
    display: flex;
    gap: 5px;
    background: rgba(20, 15, 5, 0.3);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 6px 14px;
    border-radius: 50px;
    border: 1px solid rgba(255, 215, 100, 0.2);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(255, 215, 100, 0.05);
  }

  .lang-btn {
    background: transparent;
    border: none;
    color: rgba(255, 235, 180, 0.7);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 6px 14px;
    border-radius: 40px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: inherit;
    text-transform: uppercase;
  }

  .lang-btn:hover {
    color: #fff;
    text-shadow: 0 0 10px rgba(255, 215, 100, 0.8);
    background: rgba(255, 215, 100, 0.15);
    transform: translateY(-2px);
  }

  /* MAIN CONTENT WRAPPER */
  .top-content {
    position: relative;
    z-index: 15;
    width: 100%;
    text-align: center;
    padding-top: 15vh;
    padding-left: 20px;
    padding-right: 20px;
  }

  /* SACRED SYMBOL (OM) */
  .sacred-symbol {
    text-align: center;
    margin-bottom: 12px;
  }

  .om-glow {
    font-size: 56px;
    font-weight: 500;
    font-family: 'Cinzel', 'Noto Sans Devanagari', serif;
    background: linear-gradient(180deg, #ffffff 0%, #ffd700 50%, #b8860b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.5));
    letter-spacing: 2px;
    display: inline-block;
    animation: omPulse 4s infinite ease-in-out;
    line-height: 1;
  }

  @keyframes omPulse {
    0% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8)); transform: scale(1.05); }
    100% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4)); transform: scale(1); }
  }

  .ornament-line {
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,215,100,0.8), #fff, rgba(255,215,100,0.8), transparent);
    margin: 15px auto 0 auto;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255,215,100,0.6);
  }

  /* TITLE — VISHNUMAYA */
  .temple-title {
    font-size: 4rem;
    font-weight: 700;
    font-family: 'Cinzel', serif;
    letter-spacing: 8px;
    margin-top: 10px;
    margin-bottom: 15px;
    background: linear-gradient(to bottom, #FFFDE4 0%, #F5CB5C 40%, #B98012 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    word-break: keep-all;
    line-height: 1.1;
    overflow-wrap: break-word;
  }

  .lang-ml .temple-title, .lang-ml .sacred-tagline { font-family: 'Noto Sans Malayalam', 'Cinzel', serif; letter-spacing: 2px; }
  .lang-hi .temple-title, .lang-hi .sacred-tagline { font-family: 'Noto Sans Devanagari', 'Cinzel', serif; letter-spacing: 2px; }
  .lang-ta .temple-title, .lang-ta .sacred-tagline { font-family: 'Noto Sans Tamil', 'Cinzel', serif; letter-spacing: 2px; }

  /* TAGLINE */
  .sacred-tagline {
    font-size: 1.3rem;
    font-weight: 500;
    font-family: 'Cinzel', serif;
    color: #E8D3A2;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    line-height: 1.6;
    letter-spacing: 1px;
    max-width: 600px;
    margin: 0 auto;
    opacity: 0.9;
  }

  /* BUTTON WRAPPER */
  .button-wrapper {
    position: relative;
    z-index: 15;
    width: 100%;
    display: flex;
    justify-content: center;
    padding-bottom: 10vh;
  }

  /* Premium Enter Button */
  .divine-btn {
    position: relative;
    padding: 16px 45px;
    font-size: 1.1rem;
    font-weight: 600;
    font-family: 'Cinzel', serif;
    background: linear-gradient(135deg, #1A1208 0%, #3A2510 100%);
    border: 1px solid rgba(255, 215, 100, 0.4);
    border-radius: 50px;
    color: #FCE19B;
    letter-spacing: 2px;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.4s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(200, 140, 40, 0.2);
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }

  /* Sweeping Light Effect */
  .divine-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transform: skewX(-25deg);
    transition: all 0.6s ease;
  }

  .divine-btn:hover {
    transform: translateY(-3px);
    background: linear-gradient(135deg, #2A1D0C 0%, #4A3015 100%);
    border-color: rgba(255, 215, 100, 0.8);
    color: #FFF;
    box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 30px rgba(255, 180, 50, 0.4);
  }

  .divine-btn:hover::before {
    left: 200%;
    transition: all 0.8s ease;
  }

  .divine-btn i {
    font-size: 1rem;
    transition: transform 0.4s;
  }

  .divine-btn:hover i {
    transform: translateX(6px);
  }

  /* BOTTOM ICONS */
  .sacred-lotus {
    position: absolute;
    bottom: 25px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 12;
    font-size: 20px;
    color: rgba(255,215,100,0.3);
    letter-spacing: 15px;
    pointer-events: none;
    animation: gentleBob 4s infinite ease-in-out;
  }

  @keyframes gentleBob {
    0% { transform: translateY(0); }
    50% { transform: translateY(-5px); color: rgba(255,215,100,0.6); }
    100% { transform: translateY(0); }
  }

  /* RESPONSIVENESS */
  @media (max-width: 768px) {
    .temple-title { font-size: 3rem; letter-spacing: 4px; }
    .sacred-tagline { font-size: 1.1rem; }
    .lang-bar { top: 20px; right: 20px; padding: 5px 10px; }
    .lang-btn { font-size: 0.75rem; padding: 5px 10px; }
    .om-glow { font-size: 45px; }
  }

  @media (max-width: 550px) {
    .top-content { padding-top: 12vh; }
    .temple-title { font-size: 2.2rem; letter-spacing: 2px; margin-top: 5px; }
    .sacred-tagline { font-size: 0.95rem; line-height: 1.5; padding: 0 10px; }
    .divine-btn { padding: 12px 25px; font-size: 0.85rem; }
    .om-glow { font-size: 38px; }
    .ornament-line { width: 80px; }
    .sacred-lotus { font-size: 16px; letter-spacing: 10px; bottom: 20px; }
  }

  .top-content, .button-wrapper {
    animation: elegantFadeIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    opacity: 0;
    transform: translateY(20px);
  }
  
  .button-wrapper { animation-delay: 0.3s; }

  @keyframes elegantFadeIn {
    to { opacity: 1; transform: translateY(0); }
  }

</style>
</head>
<body class="lang-en">

<div class="hero">
  <div class="overlay"></div>
  
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="lang-bar">
    <button class="lang-btn" data-lang="ml">മലയാളം</button>
    <button class="lang-btn" data-lang="hi">हिंदी</button>
    <button class="lang-btn" data-lang="ta">தமிழ்</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <div class="top-content">
     <div class="sacred-symbol">
       <div class="om-glow">ॐ</div>
       <div class="ornament-line"></div>
     </div>
    <h1 class="temple-title" id="dynamicTitle">VISHNUMAYA</h1>
    <div class="sacred-tagline" id="dynamicTagline">
      He is not just worshipped…<br>He is experienced
    </div>
  </div>

  <div class="button-wrapper">
    <button class="divine-btn" id="enterBtn">
      <span id="btnText">Enter the Divine Space</span> <i class="fas fa-arrow-right"></i>
    </button>
  </div>

  <div class="sacred-lotus">
    <i class="fas fa-lotus"></i> <i class="fas fa-circle-notch"></i> <i class="fas fa-pray"></i>
  </div>
</div>

<script>
  // Translations with proper spacing and no cutoff text
  const translations = {
    en: {
      title: "VISHNUMAYA",
      tagline: "He is not just worshipped…<br>He is experienced",
      button: "Enter the Divine Space"
    },
    ml: {
      title: "വിഷ്ണുമായ",
      tagline: "അവനെ പൂജിക്കുന്നതല്ല…<br>അനുഭവിക്കുന്നതാണ്",
      button: "ദിവ്യസാന്നിദ്ധ്യത്തിലേക്ക്"
    },
    hi: {
      title: "विष्णुमाया",
      tagline: "इनकी पूजा मात्र नहीं की जाती…<br>इन्हें अनुभव किया जाता है",
      button: "दिव्य स्थान में प्रवेश करें"
    },
    ta: {
      title: "விஷ்ணுமாயா",
      tagline: "அவரை வெறும் வழிபடுவதில்லை…<br>அனுபவிக்கப்படுகிறார்",
      button: "தெய்வீக இடத்திற்குள் நுழையுங்கள்"
    }
  };

  let currentLang = "en";

  const titleEl = document.getElementById("dynamicTitle");
  const taglineEl = document.getElementById("dynamicTagline");
  const btnSpan = document.getElementById("btnText");
  const bodyEl = document.body;

  function setLanguage(lang) {
    if (!translations[lang]) return;
    currentLang = lang;
    const data = translations[lang];
    
    bodyEl.className = '';
    if (lang === 'ml') bodyEl.classList.add('lang-ml');
    else if (lang === 'hi') bodyEl.classList.add('lang-hi');
    else if (lang === 'ta') bodyEl.classList.add('lang-ta');
    else bodyEl.classList.add('lang-en');
    
    // Smooth text transition
    titleEl.style.opacity = "0";
    taglineEl.style.opacity = "0";
    titleEl.style.transform = "translateY(5px)";
    taglineEl.style.transform = "translateY(5px)";
    titleEl.style.transition = "all 0.4s ease";
    taglineEl.style.transition = "all 0.4s ease";
    
    setTimeout(() => {
      titleEl.innerText = data.title;
      taglineEl.innerHTML = data.tagline;
      btnSpan.innerText = data.button;
      
      titleEl.style.opacity = "1";
      taglineEl.style.opacity = "1";
      titleEl.style.transform = "translateY(0)";
      taglineEl.style.transform = "translateY(0)";
    }, 400);
    
    document.documentElement.setAttribute("lang", lang === "ml" ? "ml" : (lang === "hi" ? "hi" : (lang === "ta" ? "ta" : "en")));
  }

  const langBtns = document.querySelectorAll(".lang-btn");
  langBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      const langValue = btn.getAttribute("data-lang");
      if (langValue) setLanguage(langValue);
    });
  });

  // Portal Modal Experience
  function createPortalModal() {
    if (document.getElementById("divinePortalModal")) return;
    
    const modalDiv = document.createElement("div");
    modalDiv.id = "divinePortalModal";
    modalDiv.style.position = "fixed";
    modalDiv.style.top = "0";
    modalDiv.style.left = "0";
    modalDiv.style.width = "100%";
    modalDiv.style.height = "100%";
    modalDiv.style.backgroundColor = "rgba(0,0,0,0.6)";
    modalDiv.style.backdropFilter = "blur(20px)";
    modalDiv.style.WebkitBackdropFilter = "blur(20px)";
    modalDiv.style.zIndex = "9999";
    modalDiv.style.display = "flex";
    modalDiv.style.alignItems = "center";
    modalDiv.style.justifyContent = "center";
    modalDiv.style.fontFamily = "'Cinzel', serif";
    modalDiv.style.opacity = "0";
    modalDiv.style.transition = "opacity 0.6s ease";
    
    const modalCard = document.createElement("div");
    modalCard.style.maxWidth = "550px";
    modalCard.style.width = "88%";
    // Premium frosted glass card styling
    modalCard.style.background = "linear-gradient(145deg, rgba(30, 20, 10, 0.8), rgba(10, 5, 2, 0.9))";
    modalCard.style.borderRadius = "30px";
    modalCard.style.padding = "3rem 2.5rem";
    modalCard.style.textAlign = "center";
    modalCard.style.border = "1px solid rgba(255, 215, 100, 0.3)";
    modalCard.style.boxShadow = "0 30px 60px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,215,100,0.05)";
    modalCard.style.transform = "scale(0.9) translateY(20px)";
    modalCard.style.transition = "all 0.5s cubic-bezier(0.16, 1, 0.3, 1)";
    
    let modalTitle = "", modalMsg = "", closeBtnText = "";
    
    if (currentLang === "en") {
      modalTitle = "Entering the Divine Presence";
      modalMsg = "May the grace of Vishnumaya awaken within you. Step forward with devotion. The sacred space awaits your soul.";
      closeBtnText = "Open the Inner Temple";
    } else if (currentLang === "ml") {
      modalTitle = "ദിവ്യ സാന്നിദ്ധ്യത്തിലേക്ക്";
      modalMsg = "വിഷ്ണുമായയുടെ അനുഗ്രഹം നിങ്ങളിലുണരട്ടെ. ഭക്തിയോടെ മുന്നോട്ട് പോകുക. പവിത്രമായ ഇടം നിങ്ങളെ സ്വീകരിക്കാൻ കാത്തിരിക്കുന്നു.";
      closeBtnText = "അകത്തെ ക്ഷേത്രത്തിലേക്ക്";
    } else if (currentLang === "hi") {
      modalTitle = "दिव्य उपस्थिति में प्रवेश";
      modalMsg = "विष्णुमाया की कृपा आपके भीतर जागृत हो। भक्ति के साथ आगे बढ़ें। पवित्र स्थान आपकी आत्मा की प्रतीक्षा कर रहा है।";
      closeBtnText = "आंतरिक मंदिर खोलें";
    } else {
      modalTitle = "தெய்வீக பிரசன்னத்தில் நுழைகிறது";
      modalMsg = "விஷ்ணுமாயாவின் அருள் உங்களுக்குள் துயிலெழட்டும். பக்தியுடன் முன்னேறுங்கள். புனித இடம் உங்கள் ஆன்மாவிற்காகக் காத்திருக்கிறது.";
      closeBtnText = "உள் கோவிலுக்குள் செல்லுங்கள்";
    }
    
    modalCard.innerHTML = `
      <div style="font-size: 3.5rem; color: #F5CB5C; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(245, 203, 92, 0.4)); animation: omPulse 3s infinite;">ॐ</div>
      <h2 style="color: #FFFDE4; font-size: 1.8rem; margin-bottom: 20px; letter-spacing: 2px; font-weight: 600; font-family: 'Cinzel', serif;">${modalTitle}</h2>
      <p style="color: #D4C3A3; line-height: 1.8; font-size: 1.05rem; margin-bottom: 40px; font-family: inherit; font-weight: 400;">${modalMsg}</p>
      <button id="modalEnterDeepBtn" style="background: linear-gradient(135deg, #FFD700, #B8860B); border:none; padding: 16px 36px; border-radius: 50px; color: #110A03; font-family: 'Cinzel', serif; font-weight: 800; font-size: 1rem; cursor: pointer; transition: all 0.3s; letter-spacing: 1.5px; box-shadow: 0 10px 25px rgba(184, 134, 11, 0.4); text-transform: uppercase;">${closeBtnText} <i class="fas fa-praying-hands" style="margin-left: 8px;"></i></button>
    `;
    
    modalDiv.appendChild(modalCard);
    document.body.appendChild(modalDiv);
    
    // Trigger entrance animation
    setTimeout(() => {
      modalDiv.style.opacity = "1";
      modalCard.style.transform = "scale(1) translateY(0)";
    }, 20);
    
    const enterDeepBtn = modalCard.querySelector("#modalEnterDeepBtn");
    
    // Button Hover effect inside Modal
    enterDeepBtn.addEventListener('mouseenter', () => {
        enterDeepBtn.style.transform = 'translateY(-2px)';
        enterDeepBtn.style.boxShadow = '0 15px 30px rgba(184, 134, 11, 0.6)';
    });
    enterDeepBtn.addEventListener('mouseleave', () => {
        enterDeepBtn.style.transform = 'translateY(0)';
        enterDeepBtn.style.boxShadow = '0 10px 25px rgba(184, 134, 11, 0.4)';
    });

    const closeModal = () => {
      // 1. Fade out the modal card
      modalDiv.style.opacity = "0";
      modalCard.style.transform = "scale(0.95) translateY(10px)";
      
      setTimeout(() => {
        // Remove the modal from the DOM
        if (modalDiv && modalDiv.parentNode) modalDiv.remove();
        
        // 2. Cinematic Fade-to-Black for the whole page
        document.body.style.transition = "opacity 1.2s ease-in-out";
        document.body.style.opacity = "0"; 
        
        // 3. Route to the new page after the fade finishes
        setTimeout(() => {
          window.location.href = "inner-sanctum.html"; // Routing intact
        }, 1200); 

      }, 500);
    };
    
    enterDeepBtn.addEventListener("click", closeModal);
    modalDiv.addEventListener("click", (e) => {
      if (e.target === modalDiv) closeModal();
    });
  }
  
  const enterBtn = document.getElementById("enterBtn");
  
  enterBtn.addEventListener("click", (e) => {
    // Beautiful Gold Ripple effect
    const ripple = document.createElement("span");
    const rect = enterBtn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = `${size}px`;
    ripple.style.left = `${e.clientX - rect.left - size/2}px`;
    ripple.style.top = `${e.clientY - rect.top - size/2}px`;
    ripple.style.position = "absolute";
    ripple.style.borderRadius = "50%";
    ripple.style.backgroundColor = "rgba(255, 215, 100, 0.6)";
    ripple.style.pointerEvents = "none";
    ripple.style.transform = "scale(0)";
    ripple.style.transition = "transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s ease-out";
    ripple.style.opacity = "1";
    enterBtn.style.position = "relative";
    enterBtn.style.overflow = "hidden";
    enterBtn.appendChild(ripple);
    
    setTimeout(() => {
      ripple.style.transform = "scale(4)";
      ripple.style.opacity = "0";
    }, 10);
    
    setTimeout(() => ripple.remove(), 600);
    createPortalModal();
  });
  
  // Detect browser language
  function detectAndSetInitialLanguage() {
    const browserLang = navigator.language || navigator.userLanguage;
    if (browserLang.startsWith("ml")) setLanguage("ml");
    else if (browserLang.startsWith("hi")) setLanguage("hi");
    else if (browserLang.startsWith("ta")) setLanguage("ta");
    else setLanguage("en");
  }
  
  detectAndSetInitialLanguage();
  
  // Image fallback
  const heroDiv = document.querySelector('.hero');
  const imgTest = new Image();
  imgTest.onerror = function() {
    heroDiv.style.background = 'linear-gradient(135deg, #1A1208, #0A0502), url("assets/vishnumaya.jpg")';
    heroDiv.style.backgroundBlend = "overlay";
    heroDiv.style.backgroundSize = "cover";
    heroDiv.style.backgroundPosition = "center 30%";
  };
  imgTest.src = "assets/vishnumaya.jpg";
</script>

</body>
