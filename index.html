<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vishnumaya Temple</title>

<!-- PREMIUM FONT -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body {
    margin:0;
    font-family: 'Cinzel', serif;
    color:white;
}

/* BACKGROUND */
.hero {
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    position:relative;
    background:url('assets/vishnumaya.jpg') no-repeat center center;
    background-size:cover;
}

/* CINEMATIC OVERLAY */
.overlay {
    position:absolute;
    width:100%;
    height:100%;
    background:radial-gradient(circle at center,
        rgba(0,0,0,0.2) 0%,
        rgba(0,0,0,0.6) 60%,
        rgba(0,0,0,0.9) 100%);
}

/* TOP STRIP */
.top-strip {
    position:relative;
    z-index:2;
    margin-top:20px;
}

.om {
    font-size:44px;
    color:#ffd700;
    text-shadow:0 0 15px gold;
}

.line {
    width:70%;
    height:2px;
    margin:10px auto 20px;
    background:linear-gradient(to right, transparent, gold, transparent);
}

/* LANGUAGE */
.topbar {
    position:absolute;
    top:20px;
    right:30px;
    z-index:3;
    border:1px solid rgba(255,180,80,0.7);
    padding:6px 14px;
    border-radius:12px;
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(4px);
}

.topbar button {
    background:none;
    border:none;
    color:#ffcc66;
    font-size:14px;
    margin:0 5px;
    cursor:pointer;
}

/* CONTENT */
.content {
    position:relative;
    z-index:2;
    margin-top:40px;
}

/* TITLE (BIG DIFFERENCE HERE) */
h1 {
    font-size:90px;
    font-weight:800;
    letter-spacing:4px;

    background:linear-gradient(to bottom,#fff6cc,#ffd700,#cfa300);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
        0 0 20px rgba(255,215,0,0.6),
        0 0 40px rgba(255,180,0,0.4);
}

/* TAGLINE */
.tagline {
    font-size:26px;
    margin-top:20px;
    color:#ffe6a3;
    text-shadow:0 0 10px rgba(255,200,100,0.4);
}

/* BUTTON (REAL GOLD LOOK) */
.btn {
    margin-top:45px;
    padding:18px 50px;
    font-size:18px;
    border:none;
    border-radius:12px;

    background:linear-gradient(180deg,#b07a3a,#e0b06d);
    color:white;

    box-shadow:
        inset 0 2px 5px rgba(255,255,255,0.3),
        0 10px 25px rgba(0,0,0,0.6),
        0 0 20px rgba(255,180,80,0.5);

    cursor:pointer;
    transition:0.3s;
}

.btn:hover {
    transform:scale(1.05);
    box-shadow:
        inset 0 2px 8px rgba(255,255,255,0.4),
        0 15px 30px rgba(0,0,0,0.8),
        0 0 30px rgba(255,200,100,0.8);
}

</style>
</head>

<body>

<div class="hero">

<div class="overlay"></div>

<div class="top-strip">
    <div class="om">ॐ</div>
    <div class="line"></div>
</div>

<div class="topbar">
    <button onclick="setLang('ml')">മലയാളം</button> |
    <button onclick="setLang('hi')">हिंदी</button> |
    <button onclick="setLang('ta')">தமிழ்</button> |
    <button onclick="setLang('en')">English</button>
</div>

<div class="content">

    <h1 id="title">VISHNUMAYA</h1>

    <div class="tagline" id="tagline">
        He is not just worshipped…<br>
        He is experienced
    </div>

    <button class="btn" id="enterBtn">Enter the Divine Space</button>

</div>

</div>

<script>
function setLang(lang) {

    const tagline = document.getElementById("tagline");
    const title = document.getElementById("title");
    const btn = document.getElementById("enterBtn");

    if(lang === "en") {
        title.innerText = "VISHNUMAYA";
        tagline.innerHTML = "He is not just worshipped…<br>He is experienced";
        btn.innerText = "Enter the Divine Space";
    }

    if(lang === "ml") {
        title.innerText = "വിഷ്ണുമായ";
        tagline.innerHTML = "അവനെ പൂജിക്കുന്നതല്ല…<br>അനുഭവിക്കുന്നതാണ്";
        btn.innerText = "ദിവ്യലോകത്തിലേക്ക് പ്രവേശിക്കുക";
    }

    if(lang === "hi") {
        title.innerText = "विष्णुमाया";
        tagline.innerHTML = "इनकी पूजा मात्र नहीं की जाती…<br>इन्हें अनुभव किया जाता है";
        btn.innerText = "दिव्य लोक में प्रवेश करें";
    }

    if(lang === "ta") {
        title.innerText = "விஷ்ணுமாயா";
        tagline.innerHTML = "அவரை வெறும் வழிபடுவதில்லை…<br>அனுபவிக்கப்படுகிறார்";
        btn.innerText = "தெய்வீக உலகிற்குள் செல்லுங்கள்";
    }
}
</script>

</body>
</html>
