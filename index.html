<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vishnumaya Temple</title>

<style>
body {
    margin:0;
    font-family: 'Georgia', serif;
    color:white;
}

/* HERO BACKGROUND */
.hero {
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    position:relative;
    background:url('assets/vishnumaya.jpg') no-repeat center center;
    background-size:cover;
}

/* OVERLAY */
.overlay {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
}

/* TOP STRIP */
.top-strip {
    position:relative;
    z-index:2;
    width:100%;
    padding-top:20px;
}

/* OM SYMBOL */
.om {
    font-size:42px;
    color:#ffd700;
}

/* GOLD LINE */
.line {
    width:60%;
    height:2px;
    background:linear-gradient(to right, transparent, gold, transparent);
    margin:10px auto 20px auto;
}

/* LANGUAGE BOX */
.topbar {
    position:absolute;
    top:20px;
    right:30px;
    z-index:3;
    border:1px solid #ff9933;
    padding:6px 12px;
    border-radius:10px;
    background:rgba(0,0,0,0.6);
}

.topbar button {
    background:none;
    border:none;
    color:#ffcc66;
    margin:0 6px;
    cursor:pointer;
    font-weight:bold;
}

/* CONTENT */
.content {
    position:relative;
    z-index:2;
    margin-top:20px;
}

/* TITLE */
h1 {
    font-size:72px;
    color:#ffd700;
    text-shadow:0 0 20px rgba(255,215,0,0.8);
    margin:10px 0;
}

/* TAGLINE */
.tagline {
    font-size:24px;
    color:#ffe6a3;
    margin-top:10px;
}

/* BUTTON */
.btn {
    margin-top:40px;
    padding:16px 40px;
    background:linear-gradient(#8b5a2b,#c68c53);
    border:none;
    color:#fff;
    font-weight:bold;
    font-size:18px;
    cursor:pointer;
    border-radius:10px;
    box-shadow:0 0 20px rgba(255,180,80,0.6);
}

.btn:hover {
    background:linear-gradient(#a86b2d,#e0a96d);
}
</style>

</head>

<body>

<div class="hero">

<div class="overlay"></div>

<!-- TOP DESIGN -->
<div class="top-strip">
    <div class="om">ॐ</div>
    <div class="line"></div>
</div>

<!-- LANGUAGE -->
<div class="topbar">
    <button onclick="setLang('ml')">മലയാളം</button> |
    <button onclick="setLang('hi')">हिंदी</button> |
    <button onclick="setLang('ta')">தமிழ்</button> |
    <button onclick="setLang('en')">English</button>
</div>

<!-- CONTENT -->
<div class="content">

    <h1 id="title">VISHNUMAYA</h1>

    <div class="tagline" id="tagline">
        He is not just worshipped…<br>
        He is experienced
    </div>

    <button class="btn" id="enterBtn">Enter the Divine Space</button>

</div>

</div>

<script>
function setLang(lang) {

    const tagline = document.getElementById("tagline");
    const title = document.getElementById("title");
    const btn = document.getElementById("enterBtn");

    if(lang === "en") {
        title.innerText = "VISHNUMAYA";
        tagline.innerHTML = "He is not just worshipped…<br>He is experienced";
        btn.innerText = "Enter the Divine Space";
    }

    if(lang === "ml") {
        title.innerText = "വിഷ്ണുമായ";
        tagline.innerHTML = "അവനെ പൂജിക്കുന്നതല്ല…<br>അനുഭവിക്കുന്നതാണ്";
        btn.innerText = "ദിവ്യലോകത്തിലേക്ക് പ്രവേശിക്കുക";
    }

    if(lang === "hi") {
        title.innerText = "विष्णुमाया";
        tagline.innerHTML = "इनकी पूजा मात्र नहीं की जाती…<br>इन्हें अनुभव किया जाता है";
        btn.innerText = "दिव्य लोक में प्रवेश करें";
    }

    if(lang === "ta") {
        title.innerText = "விஷ்ணுமாயா";
        tagline.innerHTML = "அவரை வெறும் வழிபடுவதில்லை…<br>அனுபவிக்கப்படுகிறார்";
        btn.innerText = "தெய்வீக உலகிற்குள் செல்லுங்கள்";
    }
}
</script>

</body>
</html>
