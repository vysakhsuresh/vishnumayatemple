<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vishnumaya Temple</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0d0d0d;
    color:white;
}

.topbar {
    position:absolute;
    top:10px;
    right:20px;
}

.topbar button {
    background:none;
    border:1px solid #ff9933;
    color:#ff9933;
    margin-left:10px;
    padding:6px 12px;
    cursor:pointer;
}

.hero {
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:url('https://images.unsplash.com/photo-1604079628040-94301bb21b91?q=80&w=1600') no-repeat center/cover;
}

.overlay {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
}

.content {
    position:relative;
    z-index:2;
}

.hero img {
    width:300px;
    border-radius:20px;
    box-shadow:0 0 30px gold;
}

h1 {
    font-size:48px;
    margin-top:20px;
}

.tagline {
    font-size:22px;
    color:#ffcc66;
    margin-top:10px;
}

.btn {
    margin-top:25px;
    padding:12px 25px;
    background:#ff9933;
    border:none;
    color:black;
    font-weight:bold;
    cursor:pointer;
    border-radius:8px;
}
</style>

</head>

<body>

<div class="topbar">
    <button onclick="setLang('ml')">മലയാളം</button>
    <button onclick="setLang('hi')">हिंदी</button>
    <button onclick="setLang('ta')">தமிழ்</button>
    <button onclick="setLang('en')">English</button>
</div>

<div class="hero">

<div class="overlay"></div>

<div class="content">

    <!-- Vishnumaya Swami Image (already added) -->
    <img src="https://images.unsplash.com/photo-1578926375605-eaf7559b1458?q=80&w=600" alt="Vishnumaya"/>

    <h1>VISHNUMAYA</h1>

    <div class="tagline" id="tagline">
        He is not just worshipped…<br>
        He is experienced
    </div>

    <button class="btn">Enter the Divine Space</button>

</div>

</div>

<script>
function setLang(lang) {

    const tagline = document.getElementById("tagline");

    if(lang === "en") {
        tagline.innerHTML = "He is not just worshipped…<br>He is experienced";
    }

    if(lang === "ml") {
        tagline.innerHTML = "അവനെ പൂജിക്കുന്നതല്ല…<br>അനുഭവിക്കുന്നതാണ്";
    }

    if(lang === "hi") {
        tagline.innerHTML = "इनकी पूजा मात्र नहीं की जाती…<br>इन्हें अनुभव किया जाता है";
    }

    if(lang === "ta") {
        tagline.innerHTML = "அவரை வெறும் வழிபடுவதில்லை…<br>அனுபவிக்கப்படுகிறார்";
    }

}
</script>

</body>
</html>
