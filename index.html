<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Vishnumaya Temple | Eternal Presence</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 (free icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cinzel', serif;
            background: #0a0702;
            overflow-x: hidden;
            height: 100vh;
        }

        /* HERO SECTION – Mystical, temple-inspired backdrop */
        .hero {
            height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: url('assets/vishnumaya.jpg') no-repeat center center/cover;
            background-attachment: fixed;
        }

        /* Enhanced gradient overlay with warmth and depth */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.65) 55%, rgba(0, 0, 0, 0.88) 100%);
            backdrop-filter: brightness(0.96);
            z-index: 1;
        }

        /* LANGUAGE SWITCHER – refined gold border, floating */
        .lang-bar {
            position: absolute;
            top: 30px;
            right: 35px;
            z-index: 20;
            display: flex;
            gap: 6px;
            background: rgba(10, 7, 2, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid rgba(218, 165, 32, 0.7);
            box-shadow: 0 0 16px rgba(218, 165, 32, 0.2);
            font-family: 'Cinzel', serif;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: #f5e2b0;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .lang-btn:hover {
            color: #ffdf8c;
            text-shadow: 0 0 6px #e4b363;
            background: rgba(255, 215, 0, 0.15);
            transform: translateY(-1px);
        }

        /* SACRED SYMBOL – OM with subtle pulse */
        .sacred-symbol {
            position: relative;
            z-index: 12;
            text-align: center;
            margin-bottom: 25px;
        }

        .om-glow {
            font-size: 70px;
            font-weight: 600;
            background: linear-gradient(135deg, #ffe6b3, #e5b83c, #f5c542);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 200, 70, 0.6);
            letter-spacing: 8px;
            display: inline-block;
            animation: subtlePulse 3s infinite ease-in-out;
        }

        @keyframes subtlePulse {
            0% { text-shadow: 0 0 15px rgba(255, 200, 70, 0.4); opacity: 0.95; transform: scale(1);}
            50% { text-shadow: 0 0 35px rgba(255, 220, 90, 0.9); opacity: 1; transform: scale(1.02);}
            100% { text-shadow: 0 0 15px rgba(255, 200, 70, 0.4); opacity: 0.95; transform: scale(1);}
        }

        .ornament-line {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #e6bc72, #ffdfa5, #e6bc72, transparent);
            margin: 18px auto 0 auto;
            border-radius: 4px;
            box-shadow: 0 0 6px #e6bc72;
        }

        /* MAIN TEXT CONTAINER */
        .main-content {
            position: relative;
            z-index: 15;
            text-align: center;
            max-width: 90%;
            padding: 0 24px;
            margin-top: 10px;
        }

        /* TITLE – Regal gold gradient with sharp presence */
        .temple-title {
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #FFF6CF 10%, #F7D44A 45%, #CFA22E 80%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 200, 70, 0.3);
            word-break: keep-all;
        }

        /* TAGLINE – Elegant, ethereal */
        .sacred-tagline {
            font-size: 1.65rem;
            font-weight: 500;
            color: #FFF6E0;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6), 0 0 10px rgba(218, 165, 32, 0.4);
            line-height: 1.45;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        /* DIVINE BUTTON – Golden, radiant, interactive */
        .divine-btn {
            margin-top: 55px;
            padding: 16px 48px;
            font-size: 1.2rem;
            font-weight: 600;
            font-family: 'Cinzel', serif;
            background: linear-gradient(145deg, #b87c2e, #8b5a2b);
            border: none;
            border-radius: 60px;
            color: #FFFAEA;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.7), inset 0 1px 0px rgba(255, 245, 170, 0.5), 0 0 0 1px rgba(230, 180, 80, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(2px);
        }

        .divine-btn i {
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        .divine-btn:hover {
            transform: scale(1.04);
            background: linear-gradient(145deg, #cf9b42, #9f6b2e);
            box-shadow: 0 20px 35px -8px black, inset 0 1px 3px rgba(255, 245, 180, 0.7), 0 0 22px rgba(255, 200, 80, 0.6);
            letter-spacing: 2.5px;
        }

        .divine-btn:hover i {
            transform: translateX(6px);
        }

        /* Decorative lotus footer */
        .sacred-lotus {
            position: absolute;
            bottom: 28px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 12;
            font-size: 20px;
            color: rgba(255, 215, 130, 0.5);
            letter-spacing: 10px;
            pointer-events: none;
        }

        /* Responsive refinements */
        @media (max-width: 800px) {
            .temple-title {
                font-size: 3.8rem;
                letter-spacing: 4px;
            }
            .sacred-tagline {
                font-size: 1.3rem;
            }
            .divine-btn {
                padding: 14px 32px;
                font-size: 1rem;
            }
            .om-glow {
                font-size: 54px;
            }
            .lang-bar {
                top: 20px;
                right: 18px;
                padding: 5px 12px;
                gap: 4px;
            }
            .lang-btn {
                font-size: 0.7rem;
                padding: 4px 8px;
            }
        }

        @media (max-width: 550px) {
            .temple-title {
                font-size: 2.7rem;
                letter-spacing: 2px;
            }
            .sacred-tagline {
                font-size: 1rem;
            }
            .divine-btn {
                margin-top: 40px;
            }
            .om-glow {
                font-size: 46px;
            }
            .ornament-line {
                width: 150px;
            }
        }

        /* Fade-in animation */
        .hero .main-content, .hero .sacred-symbol {
            animation: fadeUp 0.9s ease-out;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(35px);}
            100% { opacity: 1; transform: translateY(0);}
        }

        /* Optional film grain texture */
        .hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 6px);
            pointer-events: none;
            z-index: 3;
        }

        /* Tooltip / notification style for redirect info */
        .redirect-notify {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2a2416e6;
            backdrop-filter: blur(12px);
            color: #ffdfaa;
            padding: 12px 28px;
            border-radius: 60px;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            border: 1px solid #e1b153;
            z-index: 9999;
            white-space: nowrap;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="overlay"></div>

    <!-- Language Switcher -->
    <div class="lang-bar">
        <button class="lang-btn" data-lang="ml">മലയാളം</button>
        <button class="lang-btn" data-lang="hi">हिंदी</button>
        <button class="lang-btn" data-lang="ta">தமிழ்</button>
        <button class="lang-btn" data-lang="en">English</button>
    </div>

    <!-- OM Symbol -->
    <div class="sacred-symbol">
        <div class="om-glow">ॐ</div>
        <div class="ornament-line"></div>
    </div>

    <!-- Main text block -->
    <div class="main-content">
        <h1 class="temple-title" id="dynamicTitle">VISHNUMAYA</h1>
        <div class="sacred-tagline" id="dynamicTagline">
            He is not just worshipped…<br>He is experienced
        </div>
        <button class="divine-btn" id="enterBtn">
            <span id="btnText">Enter the Divine Space</span> <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <div class="sacred-lotus">
        <i class="fas fa-lotus"></i> <i class="fas fa-circle-notch"></i> <i class="fas fa-pray"></i>
    </div>
</div>

<script>
    // --- Translations for the landing page (elevated & soulful) ---
    const translations = {
        en: {
            title: "VISHNUMAYA",
            tagline: "He is not just worshipped…<br>He is experienced",
            button: "Enter the Divine Space"
        },
        ml: {
            title: "വിഷ്ണുമായ",
            tagline: "അവനെ പൂജിക്കുന്നതല്ല…<br>അനുഭവിക്കുന്നതാണ്",
            button: "ദിവ്യസാന്നിധ്യത്തിലേക്ക്"
        },
        hi: {
            title: "विष्णुमाया",
            tagline: "इनकी पूजा मात्र नहीं की जाती…<br>इन्हें अनुभव किया जाता है",
            button: "दिव्य लोक में प्रवेश करें"
        },
        ta: {
            title: "விஷ்ணுமாயா",
            tagline: "அவரை வெறும் வழிபடுவதில்லை…<br>அனுபவிக்கப்படுகிறார்",
            button: "தெய்வீக இடத்திற்குள் செல்லுங்கள்"
        }
    };

    let currentLang = "en";

    // DOM elements
    const titleEl = document.getElementById("dynamicTitle");
    const taglineEl = document.getElementById("dynamicTagline");
    const btnSpan = document.getElementById("btnText");

    // Function to update UI language smoothly
    function setLanguage(lang) {
        if (!translations[lang]) return;
        currentLang = lang;
        const data = translations[lang];

        // Gentle cross-fade effect
        titleEl.style.opacity = "0.7";
        taglineEl.style.opacity = "0.7";
        
        setTimeout(() => {
            titleEl.innerText = data.title;
            taglineEl.innerHTML = data.tagline;
            btnSpan.innerText = data.button;
            titleEl.style.opacity = "1";
            taglineEl.style.opacity = "1";
        }, 60);
        
        // Store language preference in localStorage for future main page
        localStorage.setItem("vishnumaya_lang", lang);
        document.documentElement.setAttribute("lang", lang === "ml" ? "ml" : (lang === "hi" ? "hi" : (lang === "ta" ? "ta" : "en")));
    }

    // Attach language button events
    const langBtns = document.querySelectorAll(".lang-btn");
    langBtns.forEach(btn => {
        btn.addEventListener("click", (e) => {
            const langValue = btn.getAttribute("data-lang");
            if (langValue) setLanguage(langValue);
        });
    });

    // --- REDIRECT HANDLER: "Enter the Divine Space" ---
    // This will navigate to the main content page (to be created later) 
    // while preserving the selected language via URL query parameter and localStorage.
    // For now, since main page doesn't exist, we show a polished notification 
    // and simulate the redirection flow. When the main page is ready, simply uncomment the redirect.
    
    const enterButton = document.getElementById("enterBtn");
    
    function showTemporaryMessage(message) {
        // Remove any existing notify
        const existing = document.querySelector(".redirect-notify");
        if(existing) existing.remove();
        
        const toast = document.createElement("div");
        toast.className = "redirect-notify";
        toast.innerText = message;
        document.body.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = "0";
            setTimeout(() => toast.remove(), 500);
        }, 2800);
    }
    
    function redirectToMainPage() {
        const selectedLang = currentLang;
        // Store language preference one more time
        localStorage.setItem("vishnumaya_lang", selectedLang);
        
        // Build the target URL with language parameter (e.g., main.html?lang=en)
        // In your final implementation, replace 'main.html' with the actual main page path.
        const targetUrl = `main.html?lang=${selectedLang}`;
        
        // Simulate a smooth transition: Because main.html may not exist yet, we inform the user.
        // However the spec says the user will later create the main page. So we provide both:
        // if the page exists (future), it redirects; otherwise we show a friendly info.
        // We'll attempt a fetch to see if main.html is available (light check), but to avoid CORS we simply
        // use a timeout. Better: we notify and then redirect if the page might exist, but we'll make it optional.
        // For a professional touch: since the main page is under development, we give a clear message.
        // But the user requested "will be redirected to the next main page with main contents (which we will create later)"
        // So we will do an actual redirect, and if the page is missing, the browser will show a 404, which is okay.
        // But to improve experience, we check existence via fetch? Not reliable cross-origin. Let's just redirect.
        // The user understands that the main page will be built later.
        
        // --- ACTUAL REDIRECT (uncomment when main.html is ready) ---
        // window.location.href = targetUrl;
        
        // For demonstration and to match the user's request, we will redirect with a small notification
        // that the main page is under construction, but the language preference is saved.
        // This ensures the user can test language flow and later you can enable the redirect.
        // Since the user said "make the best site you can as the visiting page", I'll make the button
        // actually redirect to a placeholder that will later become main.html.
        // I'll do a redirect but also add a console note. To prevent "Page not found" confusion,
        // we'll show a nice message and then after 1 second redirect? But that may be annoying.
        // Better: show a beautiful modal that says "Main temple hall loading...", then redirect.
        // Let's implement a graceful overlay that explains the transition, stores language, and redirects.
        
        // Create a subtle fullscreen transition overlay to indicate moving to main temple
        const transitionDiv = document.createElement("div");
        transitionDiv.style.position = "fixed";
        transitionDiv.style.top = "0";
        transitionDiv.style.left = "0";
        transitionDiv.style.width = "100%";
        transitionDiv.style.height = "100%";
        transitionDiv.style.backgroundColor = "rgba(0,0,0,0.85)";
        transitionDiv.style.backdropFilter = "blur(12px)";
        transitionDiv.style.zIndex = "10000";
        transitionDiv.style.display = "flex";
        transitionDiv.style.alignItems = "center";
        transitionDiv.style.justifyContent = "center";
        transitionDiv.style.flexDirection = "column";
        transitionDiv.style.fontFamily = "'Cinzel', serif";
        transitionDiv.style.opacity = "0";
        transitionDiv.style.transition = "opacity 0.5s ease";
        
        let messageText = "";
        if (currentLang === "en") messageText = "Preparing the Sacred Chamber...";
        else if (currentLang === "ml") messageText = "ദിവ്യ മണ്ഡപം ഒരുക്കുന്നു...";
        else if (currentLang === "hi") messageText = "पवित्र मंडप तैयार किया जा रहा है...";
        else messageText = "புனித மண்டபம் தயாராகிறது...";
        
        transitionDiv.innerHTML = `
            <div style="text-align: center; transform: scale(0.95); transition: transform 0.4s;">
                <i class="fas fa-om" style="font-size: 4rem; color: #eab354; margin-bottom: 25px; display: block;"></i>
                <h2 style="color: #FFE3A4; font-size: 1.8rem; letter-spacing: 2px;">${messageText}</h2>
                <div style="width: 60px; height: 2px; background: #eab354; margin: 20px auto;"></div>
                <p style="color: #e6d5b3; margin-top: 15px;">↺</p>
            </div>
        `;
        document.body.appendChild(transitionDiv);
        
        setTimeout(() => {
            transitionDiv.style.opacity = "1";
            const innerDiv = transitionDiv.querySelector("div");
            if (innerDiv) innerDiv.style.transform = "scale(1)";
        }, 20);
        
        // After a short pause, perform redirect (to main.html with language)
        setTimeout(() => {
            // For final deployment, replace with actual main page URL.
            // Since main page will be created later, we do the redirect now.
            // To avoid 404 confusion, we add a fallback: if redirect fails or user is testing,
            // we could show a note. But I'll execute redirect.
            window.location.href = `main.html?lang=${currentLang}`;
        }, 1600);
    }
    
    // Add ripple effect and call redirect
    enterButton.addEventListener("click", (e) => {
        // Ripple effect
        const ripple = document.createElement("span");
        ripple.classList.add("ripple-effect");
        const rect = enterButton.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = `${size}px`;
        ripple.style.left = `${e.clientX - rect.left - size/2}px`;
        ripple.style.top = `${e.clientY - rect.top - size/2}px`;
        ripple.style.position = "absolute";
        ripple.style.borderRadius = "50%";
        ripple.style.backgroundColor = "rgba(255,215,0,0.6)";
        ripple.style.pointerEvents = "none";
        ripple.style.transform = "scale(0)";
        ripple.style.transition = "transform 0.5s ease-out, opacity 0.6s";
        ripple.style.opacity = "0.7";
        enterButton.style.position = "relative";
        enterButton.style.overflow = "hidden";
        enterButton.appendChild(ripple);
        
        setTimeout(() => {
            ripple.style.transform = "scale(4)";
            ripple.style.opacity = "0";
        }, 10);
        setTimeout(() => ripple.remove(), 500);
        
        // Initiate redirect flow
        redirectToMainPage();
    });
    
    // Add dynamic ripple style if missing
    if (!document.querySelector("#rippleStyle")) {
        const rippleStyle = document.createElement('style');
        rippleStyle.id = "rippleStyle";
        rippleStyle.textContent = `
            .ripple-effect {
                position: absolute;
                border-radius: 50%;
                transform: scale(0);
                animation: rippleAnim 0.6s linear;
                pointer-events: none;
            }
            @keyframes rippleAnim {
                to { transform: scale(4); opacity: 0; }
            }
        `;
        document.head.appendChild(rippleStyle);
    }
    
    // --- Detect browser language for initial greeting (optional) ---
    function detectInitialLanguage() {
        const savedLang = localStorage.getItem("vishnumaya_lang");
        if (savedLang && translations[savedLang]) {
            setLanguage(savedLang);
            return;
        }
        const browserLang = navigator.language || navigator.userLanguage;
        if (browserLang.startsWith("ml")) setLanguage("ml");
        else if (browserLang.startsWith("hi")) setLanguage("hi");
        else if (browserLang.startsWith("ta")) setLanguage("ta");
        else setLanguage("en");
    }
    
    detectInitialLanguage();
    
    // Background image fallback: if image fails to load, provide a rich gradient
    const heroDiv = document.querySelector('.hero');
    const testImg = new Image();
    testImg.onerror = function() {
        heroDiv.style.background = "linear-gradient(135deg, #1f1a0c, #0e0b04), url('assets/vishnumaya.jpg')";
        heroDiv.style.backgroundBlend = "overlay";
        heroDiv.style.backgroundSize = "cover";
    };
    testImg.src = "assets/vishnumaya.jpg";
</script>

</body>
</html>
