<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishnumaya | Divine Presence</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: #faf8f3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Subtle background texture */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#e8e0d0 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.3;
            pointer-events: none;
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 60px;
            position: relative;
            z-index: 2;
        }

        /* Language selector - minimal and elegant */
        .language-selector {
            display: flex;
            justify-content: flex-end;
            gap: 4px;
            margin-bottom: 80px;
        }

        .lang-option {
            background: transparent;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #8b7a66;
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 30px;
        }

        .lang-option:hover {
            color: #b87c2e;
            background: rgba(184, 124, 46, 0.05);
        }

        .lang-option.active {
            color: #b87c2e;
            background: rgba(184, 124, 46, 0.08);
        }

        /* Main content area */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }

        /* OM symbol - refined */
        .om-symbol {
            font-size: 72px;
            font-weight: 500;
            color: #d4b68a;
            letter-spacing: 8px;
            margin-bottom: 30px;
            opacity: 0.8;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Divine line separator */
        .divine-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4b68a, #b87c2e, #d4b68a, transparent);
            margin: 20px auto 30px;
        }

        /* Main title */
        .title {
            font-size: 68px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #2c241a;
            margin-bottom: 30px;
            font-family: 'Cormorant Garamond', serif;
            text-transform: uppercase;
            line-height: 1.2;
        }

        /* Tagline */
        .tagline {
            font-size: 20px;
            font-weight: 400;
            color: #6b5a48;
            line-height: 1.6;
            margin-bottom: 50px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.3px;
        }

        .tagline br {
            display: block;
            margin: 5px 0;
        }

        /* Button - elegant and refined */
        .enter-btn {
            background: transparent;
            border: 1.5px solid #c9b38c;
            padding: 14px 48px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 2px;
            color: #7a6233;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            border-radius: 0;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .enter-btn:hover {
            background: #b87c2e;
            border-color: #b87c2e;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(184, 124, 46, 0.2);
        }

        /* Decorative elements - minimal */
        .decor-left {
            position: fixed;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 200px;
            background: linear-gradient(180deg, transparent, #d4b68a, #b87c2e, #d4b68a, transparent);
        }

        .decor-right {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 200px;
            background: linear-gradient(180deg, transparent, #d4b68a, #b87c2e, #d4b68a, transparent);
        }

        /* Footer note - subtle */
        .footer-note {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            color: #c9bbaa;
            letter-spacing: 1px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 30px 24px;
            }
            
            .title {
                font-size: 42px;
                letter-spacing: 2px;
            }
            
            .tagline {
                font-size: 16px;
            }
            
            .om-symbol {
                font-size: 52px;
            }
            
            .language-selector {
                margin-bottom: 50px;
            }
            
            .decor-left, .decor-right {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 32px;
            }
            
            .tagline {
                font-size: 14px;
            }
            
            .enter-btn {
                padding: 12px 32px;
                font-size: 12px;
            }
        }

        /* Simple fade-in animation */
        .main-content {
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Modal for redirect - elegant and minimal */
        .redirect-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(250, 248, 243, 0.98);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .redirect-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            text-align: center;
            padding: 48px;
            max-width: 400px;
        }

        .modal-om {
            font-size: 56px;
            color: #d4b68a;
            margin-bottom: 24px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .modal-text {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: #6b5a48;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .modal-sub {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: #b87c2e;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="decor-left"></div>
<div class="decor-right"></div>

<div class="container">
    <!-- Language selector - clean and minimal -->
    <div class="language-selector">
        <button class="lang-option" data-lang="en">ENGLISH</button>
        <button class="lang-option" data-lang="ml">മലയാളം</button>
        <button class="lang-option" data-lang="hi">हिंदी</button>
        <button class="lang-option" data-lang="ta">தமிழ்</button>
    </div>

    <!-- Main content -->
    <div class="main-content">
        <div class="om-symbol">ॐ</div>
        <div class="divine-line"></div>
        <h1 class="title" id="mainTitle">VISHNUMAYA</h1>
        <div class="tagline" id="mainTagline">
            He is not just worshipped…<br>He is experienced
        </div>
        <button class="enter-btn" id="enterBtn">
            <span id="btnText">ENTER THE DIVINE SPACE</span>
        </button>
    </div>
</div>

<div class="footer-note">✦ VISHNUMAYA TEMPLE ✦</div>

<!-- Redirect Modal -->
<div class="redirect-modal" id="redirectModal">
    <div class="modal-content">
        <div class="modal-om">ॐ</div>
        <div class="modal-text" id="modalMessage">Preparing the sacred space...</div>
        <div class="modal-sub" id="modalSub">Please wait</div>
    </div>
</div>

<script>
    // Sophisticated translations with elegant wording
    const translations = {
        en: {
            title: "VISHNUMAYA",
            tagline: "He is not just worshipped…<br>He is experienced",
            button: "ENTER THE DIVINE SPACE",
            modalMsg: "Preparing the sacred space...",
            modalSub: "You will be guided to the inner temple"
        },
        ml: {
            title: "വിഷ്ണുമായ",
            tagline: "അവനെ പൂജിക്കുന്നതല്ല…<br>അനുഭവിക്കുന്നതാണ്",
            button: "ദിവ്യസാന്നിധ്യത്തിലേക്ക്",
            modalMsg: "ദിവ്യമണ്ഡപം ഒരുങ്ങുന്നു...",
            modalSub: "ആന്തരിക ക്ഷേത്രത്തിലേക്ക് നിങ്ങളെ നയിക്കും"
        },
        hi: {
            title: "विष्णुमाया",
            tagline: "इनकी पूजा मात्र नहीं की जाती…<br>इन्हें अनुभव किया जाता है",
            button: "दिव्य स्थान में प्रवेश करें",
            modalMsg: "पवित्र स्थान तैयार किया जा रहा है...",
            modalSub: "आपको आंतरिक मंदिर में ले जाया जाएगा"
        },
        ta: {
            title: "விஷ்ணுமாயா",
            tagline: "அவரை வெறும் வழிபடுவதில்லை…<br>அனுபவிக்கப்படுகிறார்",
            button: "தெய்வீக இடத்திற்குள் செல்லுங்கள்",
            modalMsg: "புனித இடம் தயாராகிறது...",
            modalSub: "உள் கோவிலுக்கு உங்களை அழைத்துச் செல்லும்"
        }
    };

    let currentLang = "en";

    // DOM elements
    const titleEl = document.getElementById("mainTitle");
    const taglineEl = document.getElementById("mainTagline");
    const btnSpan = document.getElementById("btnText");
    const langBtns = document.querySelectorAll(".lang-option");
    const enterBtn = document.getElementById("enterBtn");
    const modal = document.getElementById("redirectModal");
    const modalMsgEl = document.getElementById("modalMessage");
    const modalSubEl = document.getElementById("modalSub");

    // Function to update UI with selected language
    function setLanguage(lang) {
        if (!translations[lang]) return;
        
        currentLang = lang;
        const data = translations[lang];
        
        // Update active class on language buttons
        langBtns.forEach(btn => {
            if (btn.getAttribute("data-lang") === lang) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });
        
        // Update content with smooth transition
        titleEl.style.opacity = "0";
        taglineEl.style.opacity = "0";
        btnSpan.style.opacity = "0";
        
        setTimeout(() => {
            titleEl.innerText = data.title;
            taglineEl.innerHTML = data.tagline;
            btnSpan.innerText = data.button;
            
            titleEl.style.opacity = "1";
            taglineEl.style.opacity = "1";
            btnSpan.style.opacity = "1";
        }, 150);
        
        // Save language preference
        localStorage.setItem("vishnumaya_lang", lang);
    }

    // Elegant redirect function
    function redirectToMainPage() {
        // Update modal messages based on current language
        const data = translations[currentLang];
        modalMsgEl.innerText = data.modalMsg;
        modalSubEl.innerText = data.modalSub;
        
        // Show modal with fade effect
        modal.classList.add("active");
        
        // Save language for main page
        localStorage.setItem("vishnumaya_lang", currentLang);
        
        // After a graceful delay, redirect to main page with language parameter
        setTimeout(() => {
            // Build the URL for the main page (to be created later)
            const targetUrl = `main.html?lang=${currentLang}`;
            
            // For now, we simulate the redirect with a message
            // In production, uncomment the line below for actual redirect
            // window.location.href = targetUrl;
            
            // Since main.html will be created later, we show a beautiful completion message
            // and then simulate that the redirect would happen
            modalMsgEl.innerText = currentLang === "en" ? "The divine space awaits..." :
                                   currentLang === "ml" ? "ദിവ്യസന്നിധി കാത്തിരിക്കുന്നു..." :
                                   currentLang === "hi" ? "दिव्य स्थान प्रतीक्षा कर रहा है..." :
                                   "தெய்வீக இடம் காத்திருக்கிறது...";
            
            modalSubEl.innerHTML = currentLang === "en" ? "✨ You will be redirected shortly ✨" :
                                  currentLang === "ml" ? "✨ നിങ്ങളെ താമസിയാതെ മാറ്റും ✨" :
                                  currentLang === "hi" ? "✨ आपको जल्द ही पुनर्निर्देशित किया जाएगा ✨" :
                                  "✨ நீங்கள் விரைவில் திருப்பிவிடப்படுவீர்கள் ✨";
            
            // Simulate redirect after beautiful pause
            setTimeout(() => {
                // Uncomment for actual redirect when main.html is ready
                // window.location.href = `main.html?lang=${currentLang}`;
                
                // For now, just close modal with a message
                modal.classList.remove("active");
                
                // Show a subtle notification that the main page will be available
                showNotification();
            }, 2000);
        }, 1800);
    }
    
    // Subtle notification for development
    function showNotification() {
        const notification = document.createElement("div");
        notification.style.position = "fixed";
        notification.style.bottom = "100px";
        notification.style.left = "50%";
        notification.style.transform = "translateX(-50%)";
        notification.style.backgroundColor = "#2c241a";
        notification.style.color = "#faf8f3";
        notification.style.padding = "12px 28px";
        notification.style.fontFamily = "'Inter', sans-serif";
        notification.style.fontSize = "12px";
        notification.style.letterSpacing = "1px";
        notification.style.borderRadius = "0";
        notification.style.zIndex = "1001";
        notification.style.border = "1px solid #d4b68a";
        notification.style.opacity = "0";
        notification.style.transition = "opacity 0.3s ease";
        
        if (currentLang === "en") notification.innerText = "✦ Main temple page will be created soon ✦";
        else if (currentLang === "ml") notification.innerText = "✦ പ്രധാന ക്ഷേത്ര പേജ് ഉടൻ സൃഷ്ടിക്കും ✦";
        else if (currentLang === "hi") notification.innerText = "✦ मुख्य मंदिर पृष्ठ जल्द ही बनाया जाएगा ✦";
        else notification.innerText = "✦ முக்கிய கோவில் பக்கம் விரைவில் உருவாக்கப்படும் ✦";
        
        document.body.appendChild(notification);
        
        setTimeout(() => {
            notification.style.opacity = "1";
        }, 50);
        
        setTimeout(() => {
            notification.style.opacity = "0";
            setTimeout(() => notification.remove(), 300);
        }, 3000);
    }

    // Button click handler with ripple effect
    enterBtn.addEventListener("click", function(e) {
        // Ripple effect
        const ripple = document.createElement("span");
        ripple.style.position = "absolute";
        ripple.style.borderRadius = "50%";
        ripple.style.backgroundColor = "rgba(184, 124, 46, 0.3)";
        ripple.style.width = "0";
        ripple.style.height = "0";
        ripple.style.left = `${e.clientX - enterBtn.getBoundingClientRect().left}px`;
        ripple.style.top = `${e.clientY - enterBtn.getBoundingClientRect().top}px`;
        ripple.style.transform = "translate(-50%, -50%)";
        ripple.style.transition = "width 0.6s, height 0.6s, opacity 0.6s";
        ripple.style.pointerEvents = "none";
        ripple.style.zIndex = "1";
        
        enterBtn.style.position = "relative";
        enterBtn.style.overflow = "hidden";
        enterBtn.appendChild(ripple);
        
        setTimeout(() => {
            ripple.style.width = "300px";
            ripple.style.height = "300px";
            ripple.style.opacity = "0";
        }, 10);
        
        setTimeout(() => ripple.remove(), 600);
        
        // Trigger redirect
        redirectToMainPage();
    });

    // Language button listeners
    langBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            const lang = btn.getAttribute("data-lang");
            setLanguage(lang);
        });
    });
    
    // Detect saved language or browser preference
    function detectInitialLanguage() {
        const savedLang = localStorage.getItem("vishnumaya_lang");
        if (savedLang && translations[savedLang]) {
            setLanguage(savedLang);
            return;
        }
        
        const browserLang = navigator.language || navigator.userLanguage;
        if (browserLang.startsWith("ml")) setLanguage("ml");
        else if (browserLang.startsWith("hi")) setLanguage("hi");
        else if (browserLang.startsWith("ta")) setLanguage("ta");
        else setLanguage("en");
    }
    
    detectInitialLanguage();
    
    // Optional: Add subtle parallax effect on mouse move (very subtle)
    document.addEventListener("mousemove", function(e) {
        const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
        const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
        
        const title = document.querySelector(".title");
        const om = document.querySelector(".om-symbol");
        
        if (title && om) {
            title.style.transform = `translate(${moveX * 0.3}px, ${moveY * 0.2}px)`;
            om.style.transform = `translate(${moveX * 0.2}px, ${moveY * 0.15}px)`;
        }
    });
    
    // Reset transform on mouse leave
    document.addEventListener("mouseleave", function() {
        const title = document.querySelector(".title");
        const om = document.querySelector(".om-symbol");
        if (title && om) {
            title.style.transform = "translate(0, 0)";
            om.style.transform = "translate(0, 0)";
        }
    });
    
    // Smooth appearance for language buttons
    const style = document.createElement('style');
    style.textContent = `
        .lang-option, .title, .tagline, .enter-btn, .om-symbol {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .enter-btn {
            position: relative;
        }
        
        .redirect-modal.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            animation: modalFadeIn 0.5s ease;
        }
        
        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    `;
    document.head.appendChild(style);
</script>

</body>
</html>
